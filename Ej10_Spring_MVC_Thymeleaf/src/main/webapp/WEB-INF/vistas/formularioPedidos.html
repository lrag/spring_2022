<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta>
	<title>Thymeleaf</title>
    <link rel="stylesheet" href="css/bootstrap.css">
        <script type="application/javascript" src="./formularioPedidos.js"></script>
</head>
<body>

	<div th:replace="fragmentos/cabecera.html"></div>
	<div th:replace="fragmentos/menu"></div>

    <h3 class="text-center mt-3 mb-3">
        Listado de pedidos
    </h3>
	
	<div align="center">
		<h2 th:text="${mensaje}"></h2>	
	</div>
	
	<form id="formularioPedidos" method="POST" th:object="${pedido}">
	
	    <div class="text-center">
	        <button id="btnInsertar"  class="btn btn-primary mr-1">Insertar</button>
	        <button id="btnModificar" class="btn btn-primary mr-1">Modificar</button>
	        <button id="btnBorrar"    class="btn btn-danger  mr-1">Borrar</button>
	        <button id="btnAceptar"   class="btn btn-primary mr-1">Aceptar</button>
	        <input type="button" id="btnVaciar" class="btn btn-warning mr-1" value="Vaciar"/>
	        <input type="button" id="btnVolver" class="btn btn-warning mr-1" value="Volver"/>
	    </div>	
	    
	    <div class="mt-3"></div>
		
		<input type="hidden" th:field="*{id}" id="idPedido"/>
		
	    <div class="row">
	        
	        <div class="row col-sm-12 offset-sm-0 col-md-8 offset-md-2">

	            <div class="col-2 mt-1">
	                <label>Código</label>
	            </div>
	            <div class="col-10 mt-1">
	                <input type="text" th:field="*{codigo}" id="codigo" class="form-control"/>
					<span th:errors="*{codigo}" class="text-danger"></span>
	            </div>
	            
	            <div class="col-2 mt-1">
	                <label>Fecha</label>
	            </div>
	            <div class="col-10 mt-1">
	                <input type="text" th:field="*{fecha}" id="fecha" class="form-control"/>
					<span th:errors="*{fecha}" class="text-danger"></span>
	            </div>                 
	            
	            <div class="col-2 mt-1">
	                <label>Cliente</label>
	            </div>
	            <div class="col-10 mt-1">
                    <select th:field="*{cliente.id}" class="form-control">
                         <option value="">Seleccione...</option>
                         <option th:each="cliente : ${listaClientes}"
                            th:value="${cliente.id}"
                            th:utext="${cliente.nombre}"/>
                	</select>				
					<span th:errors="*{cliente.id}" class="text-danger"></span>	                
	            </div>
	            
	            <div class="col-2 mt-1">
	                <label>Estado</label>
	            </div>
	            <div class="col-10 mt-1">
					<input type="text" th:field="*{estado}" id="estado" class="form-control"/>
					<span th:errors="*{estado}" class="text-danger"></span>	                
	            </div>

	        </div>    
	    </div>		
	
	</form>

	<hr/>
	
	<form id="formularioDetalles" method="POST" th:object="${detalle}">
	
	    <div class="text-center">
	        <button id="btnInsertarDetalle"  class="btn btn-primary mr-1" th:disabled="${pedido.id==null}">Insertar</button>
	        <button id="btnModificarDetalle" class="btn btn-primary mr-1" th:disabled="${pedido.id==null}">Modificar</button>
	        <button id="btnBorrarDetalle"    class="btn btn-danger  mr-1" th:disabled="${pedido.id==null}">Borrar</button>
	        <input type="button" id="btnVaciarDetalle" class="btn btn-warning mr-1" value="Vaciar"/>
	    </div>	

		<div class="mt-3"></div>

		<input type="hidden" th:field="*{id}" id="idDetalle"/>
		<input type="hidden" th:field="*{pedido.id}" id="idPedido"/>
	
	    <div class="row">
	    
	        <div class="row col-sm-12 offset-sm-0 col-md-8 offset-md-2">
	            <div class="col-2 mt-1">
	                <label>Producto</label>
	            </div>
	            <div class="col-10 mt-1">
                    <select th:field="*{producto.id}" class="form-control">
                         <option value="">Seleccione...</option>
                         <option th:each="producto : ${listaProductos}"
                            th:value="${producto.id}"
                            th:utext="${producto.nombre}"/>
                	</select>					
					<span th:errors="*{producto.id}" class="text-danger"></span>
	            </div>
	            
	            <div class="col-2 mt-1">
	                <label>Cantidad</label>
	            </div>
	            <div class="col-10 mt-1">
	                <input type="text" th:field="*{cantidad}" id="fecha" class="form-control"/>
					<span th:errors="*{cantidad}" class="text-danger"></span>
	            </div>                 
	            
	            <div class="col-2 mt-1">
	                <label>Precio</label>
	            </div>
	            <div class="col-10 mt-1">
					<input type="text" th:field="*{precio}" id="estado" class="form-control"/>
					<span th:errors="*{precio}" class="text-danger"></span>	                
	            </div>
	        </div>  
		</div>	
		
		<div class="mt-3"></div>
		
		<div class="row">
	        <div class="col-sm-12 offset-sm-0 col-md-8 offset-md-2">
		        <table class="table table-hover table-striped">    
					<tr>
						<th>Producto</th>
						<th>Cantidad</th>
						<th>Precio</th>
						<th>Total</th>
					</tr>
					<tr th:each="detalle: ${pedido.detalles}">
						<td>
							<a th:href="@{seleccionarDetalle(id=${detalle.id})}" th:text="${detalle.producto.nombre}"></a>
						</td>			
						<td th:text="${detalle.cantidad}"/>			
						<td th:text="${detalle.precio}"/>			
						<td th:text="${detalle.precio*detalle.cantidad}"/>			
					</tr>
					<tr th:if="${pedido.detalles==null || pedido.detalles.size==0}">
						<td colspan="4">
							No hay detalles
						</td>
					</tr>
				</table>
			</div>
		</div>
	
	</form>	

</body>
</html>
